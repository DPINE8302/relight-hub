name: Windows native app

on:
  pull_request:
    paths:
      - 'projects/native-app-windows/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/native-app-windows

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: projects/native-app-windows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test the show engine
        run: dotnet test RELightNative.Windows.slnx --configuration Release --nologo
      - name: Build the unsigned installer
        run: ./installer/publish.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: RE-light Windows ${{ matrix.arch }} Preview
          path: projects/native-app-windows/artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14
